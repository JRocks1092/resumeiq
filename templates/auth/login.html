{% extends 'base.html' %}
{% block title %}Login — ResumeIQ{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md animate-fade-in">

        <!-- Hero -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center mx-auto mb-4 animate-float">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-surface-400">Sign in to your ResumeIQ account</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card p-8 glow-primary animate-pulse-glow">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Email Address</label>
                    <input type="email" id="login-email" required class="input-field w-full px-4 py-3 text-sm" placeholder="you@example.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Password</label>
                    <input type="password" id="login-password" required class="input-field w-full px-4 py-3 text-sm" placeholder="••••••••">
                </div>
                <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                <button type="submit" id="login-btn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-sm">Sign In</button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-surface-400 text-sm">Don't have an account? <a href="/register/" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Create one</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (isLoggedIn()) {
        const user = getUserData();
        if (user && user.role === 'hr') window.location.href = '/hr/dashboard/';
        else window.location.href = '/vacancies/';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const errorDiv = document.getElementById('login-error');
        errorDiv.classList.add('hidden');
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner mx-auto" style="width:20px;height:20px;border-width:2px;"></div>';

        try {
            const response = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await response.json();

            if (response.ok) {
                setTokens(data.access, data.refresh);
                const profileResponse = await fetch('/api/users/me/', { headers: { 'Authorization': `Bearer ${data.access}` } });
                const profile = await profileResponse.json();
                setUserData(profile);
                showToast('Login successful!');
                setTimeout(() => {
                    if (profile.role === 'hr') window.location.href = '/hr/dashboard/';
                    else window.location.href = '/vacancies/';
                }, 500);
            } else {
                errorDiv.textContent = data.detail || 'Invalid email or password.';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
{% endblock %}
