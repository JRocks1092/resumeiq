{% extends 'base.html' %}
{% block title %}Register — ResumeIQ{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md animate-fade-in">

        <!-- Hero -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-accent-500 to-primary-500 flex items-center justify-center mx-auto mb-4 animate-float">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
        </div>

        <!-- Register Card -->
        <div class="glass-card p-8 glow-accent">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Full Name</label>
                    <input type="text" id="reg-username" required class="input-field w-full px-4 py-3 text-sm" placeholder="John Doe">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Email Address</label>
                    <input type="email" id="reg-email" required class="input-field w-full px-4 py-3 text-sm" placeholder="you@example.com">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Phone Number</label>
                    <input type="tel" id="reg-phone" required class="input-field w-full px-4 py-3 text-sm" placeholder="+1 234 567 8900">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-surface-300 mb-2">Password</label>
                    <input type="password" id="reg-password" required minlength="6" class="input-field w-full px-4 py-3 text-sm" placeholder="••••••••">
                </div>
                <div class="mb-6" hidden="true">
                    <label class="block text-sm font-medium text-surface-300 mb-2">I am a...</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="candidate" checked class="sr-only peer">
                            <div class="input-field p-3 text-center text-sm peer-checked:border-primary-500 peer-checked:bg-primary-500/10 peer-checked:text-primary-400 transition-all">
                                <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                Candidate
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="hr" class="sr-only peer">
                            <div class="input-field p-3 text-center text-sm peer-checked:border-accent-500 peer-checked:bg-accent-500/10 peer-checked:text-accent-400 transition-all">
                                <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                HR Admin
                            </div>
                        </label>
                    </div>
                </div>
                <div id="reg-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                <button type="submit" id="reg-btn" class="btn-accent w-full py-3 rounded-xl text-white font-semibold text-sm">Create Account</button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-surface-400 text-sm">Already have an account? <a href="/" class="text-accent-400 hover:text-accent-300 font-medium transition-colors">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (isLoggedIn()) {
        const user = getUserData();
        if (user && user.role === 'hr') window.location.href = '/hr/dashboard/';
        else window.location.href = '/vacancies/';
    }

    async function handleRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        const errorDiv = document.getElementById('reg-error');
        errorDiv.classList.add('hidden');
        const role = "candidate";
        const payload = {
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            phone_number: document.getElementById('reg-phone').value,
            password: document.getElementById('reg-password').value,
            role: role,
        };

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner mx-auto" style="width:20px;height:20px;border-width:2px;border-top-color:#fff;"></div>';

        try {
            const response = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await response.json();

            if (response.ok) {
                showToast('Account created! Signing you in...');
                const loginResponse = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: payload.email, password: payload.password }),
                });
                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    setTokens(loginData.access, loginData.refresh);
                    setUserData(data.user);
                    setTimeout(() => {
                        if (role === 'hr') window.location.href = '/hr/dashboard/';
                        else window.location.href = '/vacancies/';
                    }, 500);
                } else {
                    window.location.href = '/';
                }
            } else {
                let errors = [];
                for (const [key, value] of Object.entries(data)) {
                    errors.push(Array.isArray(value) ? `${key}: ${value.join(', ')}` : value);
                }
                errorDiv.textContent = errors.join(' | ') || 'Registration failed.';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }
</script>
{% endblock %}
