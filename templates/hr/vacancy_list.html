{% extends 'base.html' %}
{% block title %}Manage Vacancies — ResumeIQ{% endblock %}

{% block content %}
<div class="animate-fade-in">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold text-white mb-2">Manage Vacancies</h1>
            <p class="text-surface-400">Create, edit, and manage your job postings</p>
        </div>
        <a href="/hr/vacancies/create/" class="btn-primary px-5 py-2.5 rounded-xl text-white text-sm font-medium flex items-center">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Create Vacancy
        </a>
    </div>
    <div class="glass-card p-6"><div id="vacancies-table"></div></div>
</div>

<!-- Delete Modal -->
<div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="glass-card p-8 max-w-md w-full mx-4">
        <h3 class="text-lg font-bold text-white mb-2">Delete Vacancy</h3>
        <p class="text-surface-400 text-sm mb-6">Are you sure? This action cannot be undone.</p>
        <div class="flex justify-end space-x-3">
            <button onclick="closeDeleteModal()" class="px-4 py-2 rounded-lg text-surface-400 hover:text-white text-sm font-medium">Cancel</button>
            <button onclick="confirmDelete()" class="btn-danger px-4 py-2 rounded-lg text-white text-sm font-medium">Delete</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let deleteVacancyId = null;

    async function loadVacancies() {
        showLoading('vacancies-table');
        try {
            const response = await apiFetch('/api/vacancies/', { method: 'GET' });
            const vacancies = await response.json();
            const container = document.getElementById('vacancies-table');

            if (vacancies.length === 0) { container.innerHTML = '<div class="text-center py-12 text-surface-400 text-sm">No vacancies yet</div>'; return; }

            container.innerHTML = `<div class="overflow-x-auto"><table class="w-full">
                <thead><tr class="border-b border-surface-700">
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-3 px-4">Title</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-3 px-4">Positions</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-3 px-4">Deadline</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-3 px-4">Created</th>
                    <th class="text-right text-xs font-semibold text-surface-400 uppercase tracking-wider py-3 px-4">Actions</th>
                </tr></thead>
                <tbody>${vacancies.map(v => `
                    <tr class="border-b border-surface-800 table-row-hover">
                        <td class="py-4 px-4"><a href="/hr/vacancies/${v.id}/applicants/" class="text-white font-medium text-sm hover:text-primary-400 transition-colors">${v.title}</a></td>
                        <td class="py-4 px-4 text-surface-400 text-sm">${v.no_of_positions}</td>
                        <td class="py-4 px-4 text-surface-400 text-sm">${new Date(v.date).toLocaleDateString()}</td>
                        <td class="py-4 px-4 text-surface-500 text-sm">${new Date(v.created_at).toLocaleDateString()}</td>
                        <td class="py-4 px-4 text-right space-x-2">
                            <a href="/hr/vacancies/${v.id}/applicants/" class="text-primary-400 hover:text-primary-300 text-sm font-medium">Applicants</a>
                            <a href="/hr/vacancies/${v.id}/edit/" class="text-surface-400 hover:text-white text-sm font-medium">Edit</a>
                            <button onclick="showDeleteModal('${v.id}')" class="text-red-400 hover:text-red-300 text-sm font-medium">Delete</button>
                        </td>
                    </tr>
                `).join('')}</tbody>
            </table></div>`;
        } catch (err) {
            document.getElementById('vacancies-table').innerHTML = '<div class="text-center py-8 text-red-400">Failed to load vacancies.</div>';
        }
    }

    function showDeleteModal(id) { deleteVacancyId = id; document.getElementById('delete-modal').classList.remove('hidden'); }
    function closeDeleteModal() { deleteVacancyId = null; document.getElementById('delete-modal').classList.add('hidden'); }

    async function confirmDelete() {
        if (!deleteVacancyId) return;
        try {
            const response = await apiFetch(`/api/vacancies/${deleteVacancyId}/`, { method: 'DELETE' });
            if (response.ok || response.status === 204) { showToast('Vacancy deleted.'); closeDeleteModal(); loadVacancies(); }
            else showToast('Failed to delete.', 'error');
        } catch (err) { showToast('Network error.', 'error'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = getUserData();
        if (!user || user.role !== 'hr') { window.location.href = '/'; return; }
        loadVacancies();
    });
</script>
{% endblock %}
