{% extends 'base.html' %}
{% block title %}Applicants — ResumeIQ{% endblock %}

{% block content %}
<div class="animate-fade-in">
    <a href="/hr/vacancies/" class="inline-flex items-center text-surface-400 hover:text-primary-400 transition-colors text-sm mb-6">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Back to Vacancies
    </a>

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2" id="page-title">Applicants</h1>
        <p class="text-surface-400">Ranked by AI analysis score</p>
    </div>

    <div id="applicants-container"></div>

    <div id="empty-state" class="hidden text-center py-16">
        <svg class="w-16 h-16 mx-auto text-surface-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <h3 class="text-lg font-semibold text-surface-400 mb-1">No applicants yet</h3>
        <p class="text-surface-500 text-sm">Applicants will appear here once they apply</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const vacancyId = '{{ vacancy_id }}';

    async function loadApplicants() {
        showLoading('applicants-container');
        try {
            const vacR = await apiFetch(`/api/vacancies/${vacancyId}/`, { method: 'GET' });
            const vacancy = await vacR.json();
            document.getElementById('page-title').textContent = `Applicants for "${vacancy.title}"`;

            const r = await apiFetch(`/api/vacancies/${vacancyId}/applicants/`, { method: 'GET' });
            const applicants = await r.json();
            const container = document.getElementById('applicants-container');
            const emptyState = document.getElementById('empty-state');

            if (applicants.length === 0) { container.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');

            container.innerHTML = `<div class="glass-card overflow-hidden"><div class="overflow-x-auto"><table class="w-full">
                <thead><tr class="border-b border-surface-700 bg-surface-900/30">
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Rank</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Candidate</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Score</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Rating</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Status</th>
                    <th class="text-left text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Applied</th>
                    <th class="text-right text-xs font-semibold text-surface-400 uppercase tracking-wider py-4 px-6">Actions</th>
                </tr></thead>
                <tbody>${applicants.map((a, i) => {
                    const rank = a.overall_score !== null ? i + 1 : '—';
                    const sc = a.overall_score;
                    const clr = sc >= 80 ? 'text-green-400' : sc >= 60 ? 'text-blue-400' : sc >= 40 ? 'text-yellow-400' : sc !== null ? 'text-red-400' : 'text-surface-500';
                    return `<tr class="border-b border-surface-800 table-row-hover">
                        <td class="py-4 px-6 text-white font-bold text-lg">${rank}</td>
                        <td class="py-4 px-6"><p class="text-white font-medium text-sm">${a.candidate_name}</p><p class="text-surface-500 text-xs">${a.candidate_email}</p></td>
                        <td class="py-4 px-6"><span class="text-2xl font-bold ${clr}">${sc !== null ? sc : '—'}</span><span class="text-surface-500 text-xs">/100</span></td>
                        <td class="py-4 px-6">${a.rating !== 'N/A' ? getRatingBadge(a.rating) : '<span class="text-surface-500 text-sm">—</span>'}</td>
                        <td class="py-4 px-6">${getStatusBadge(a.status)}</td>
                        <td class="py-4 px-6 text-surface-400 text-sm">${new Date(a.applied_at).toLocaleDateString()}</td>
                        <td class="py-4 px-6 text-right">${sc !== null ? `<a href="/hr/applications/${a.application_id}/" class="btn-primary px-4 py-1.5 rounded-lg text-white text-xs font-medium inline-block">View Details</a>` : '<span class="text-surface-500 text-xs">Pending</span>'}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div></div>`;
        } catch (err) {
            document.getElementById('applicants-container').innerHTML = '<div class="text-center py-8 text-red-400">Failed to load applicants.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const u = getUserData();
        if (!u || u.role !== 'hr') { window.location.href = '/'; return; }
        loadApplicants();
    });
</script>
{% endblock %}
