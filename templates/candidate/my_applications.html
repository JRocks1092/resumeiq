{% extends 'base.html' %}
{% block title %}My Applications — ResumeIQ{% endblock %}

{% block content %}
<div class="animate-fade-in">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">My Applications</h1>
        <p class="text-surface-400">Track the status of your resume submissions</p>
    </div>
    <div id="applications-container"></div>
    <div id="empty-state" class="hidden text-center py-16">
        <svg class="w-16 h-16 mx-auto text-surface-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <h3 class="text-lg font-semibold text-surface-400 mb-1">No applications yet</h3>
        <p class="text-surface-500 text-sm mb-4">Start by browsing available vacancies</p>
        <a href="/vacancies/" class="btn-primary inline-block px-6 py-2.5 rounded-xl text-white text-sm font-medium">Browse Vacancies</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadApplications() {
        showLoading('applications-container');
        try {
            const response = await apiFetch('/api/applications/list/', { method: 'GET' });
            const apps = await response.json();
            const container = document.getElementById('applications-container');
            const emptyState = document.getElementById('empty-state');

            if (apps.length === 0) { container.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');

            container.innerHTML = `<div class="space-y-4">${apps.map((app, i) => `
                <div class="glass-card p-6 transition-all-smooth hover:glow-primary" style="animation: fadeIn 0.5s ease-out ${i * 0.1}s both">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-white mb-1">${app.vacancy_title}</h3>
                            <p class="text-surface-500 text-xs">Applied ${new Date(app.applied_at).toLocaleString()}</p>
                        </div>
                        <div class="ml-4">${getStatusBadge(app.status)}</div>
                    </div>
                    ${app.status === 'processing' ? '<div class="mt-4 flex items-center text-blue-400 text-sm"><div class="spinner mr-2" style="width:16px;height:16px;border-width:2px;"></div>AI is analysing your resume...</div>' : ''}
                </div>
            `).join('')}</div>`;
        } catch (err) {
            document.getElementById('applications-container').innerHTML = '<div class="text-center py-8 text-red-400">Failed to load applications.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadApplications);
    setInterval(() => { if (document.querySelectorAll('.badge-processing').length > 0) loadApplications(); }, 10000);
</script>
{% endblock %}
